<!DOCTYPE html>
<html lang="$lang$">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$ – $site-title$</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<p><a href="/"><img src="/favicon.svg" alt="" width="26" height="23"> $site-title$</a></p>
</header>
<main>
<article>
$if(title)$
<h1>$title$</h1>
$endif$
$if(published)$
<p class="meta">Published <time datetime="$published$">$published$</time></p>
$endif$
$body$
$if(changelog)$
<section class="changelog">
<h2>Changelog</h2>
$for(changelog)$
<p><time datetime="$it.date$">$it.date$</time>: $it.note$</p>
$endfor$
</section>
$endif$
$if(published)$
<p class="reply"><a href="mailto:$email$?subject=Re: $title$">Reply by email</a></p>
$endif$
</article>
</main>
<footer>
<a href="/">Home</a> ·
<a href="/articles/">Articles</a> ·
<a href="/about-me/">About me</a> ·
<a href="/feed.xml">Feed</a> ·
<a href="/impressum/">Impressum &amp; privacy</a>
</footer>
</body>
</html>
